<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find My Classroom</title>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f4f6fb;
    --card-bg: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --error: #dc2626;
    --error-bg: #fef2f2;
    --border: #e5e7eb;
    --radius: 16px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    width: 100%;
    max-width: 420px;
  }

  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 32px 24px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
  }

  h1 {
    font-size: 1.5rem;
    margin: 0 0 6px 0;
    text-align: center;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 24px 0;
  }

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 8px;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.1rem;
    border: 2px solid var(--border);
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s ease;
    text-transform: uppercase;
  }

  input[type="text"]:focus {
    border-color: var(--primary);
  }

  button {
    width: 100%;
    padding: 15px;
    font-size: 1.05rem;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 16px;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  button:active {
    transform: scale(0.98);
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-dark);
  }

  .btn-secondary {
    background: #111827;
    color: #fff;
  }

  .btn-secondary:hover {
    background: #000;
  }

  .result-card {
    margin-top: 24px;
    display: none;
  }

  .result-card.visible {
    display: block;
  }

  .result-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin: 0 0 16px 0;
    color: var(--primary);
  }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }

  .result-row:last-of-type {
    border-bottom: none;
  }

  .result-label {
    font-size: 0.85rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .result-value {
    font-size: 1.05rem;
    font-weight: 600;
    text-align: right;
  }

  .error-box {
    margin-top: 24px;
    display: none;
    background: var(--error-bg);
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }

  .error-box.visible {
    display: block;
  }

  .error-title {
    color: var(--error);
    font-weight: 700;
    margin: 0 0 4px 0;
  }

  .error-text {
    color: #7f1d1d;
    font-size: 0.9rem;
    margin: 0;
  }

  .footer-note {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Find My Classroom</h1>
    <p class="subtitle">Enter your room code</p>

    <label for="roomCodeInput">Room code</label>
    <input
      type="text"
      id="roomCodeInput"
      placeholder="e.g. A401"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    >

    <button class="btn-primary" id="findButton">Find My Room</button>

    <div class="result-card" id="resultCard">
      <p class="result-title">Your Classroom</p>
      <div class="result-row">
        <span class="result-label">Building</span>
        <span class="result-value" id="resultBuilding"></span>
      </div>
      <div class="result-row">
        <span class="result-label">Floor</span>
        <span class="result-value" id="resultFloor"></span>
      </div>
      <div class="result-row">
        <span class="result-label">Room</span>
        <span class="result-value" id="resultRoom"></span>
      </div>
      <button class="btn-secondary" id="mapButton">Show on Map</button>
    </div>

    <div class="error-box" id="errorBox">
      <p class="error-title">Room not found</p>
      <p class="error-text">Please check your room code and try again.</p>
    </div>
  </div>

  <p class="footer-note">First-year friendly · Works on any phone</p>
</div>

<script>
  // ============================================================
  // ROOM DATABASE
  // Add, remove, or edit rooms here. Each key is the normalized
  // room code (uppercase, no spaces). Each value describes the
  // building, floor, display room number, and the Google Maps
  // link to open for that building.
  // ============================================================
  const ROOM_DATABASE = {
    // --- Engineering Building A ---
    "A100": { building: "Engineering Building A", floor: "1st Floor", room: "A100", mapUrl: "https://maps.app.goo.gl/yGGVG7TGVgND5Yk57" },
    "A312": { building: "Engineering Building A", floor: "3rd Floor", room: "A312", mapUrl: "https://maps.app.goo.gl/yGGVG7TGVgND5Yk57" },
    "A313": { building: "Engineering Building A", floor: "3rd Floor", room: "A313", mapUrl: "https://maps.app.goo.gl/yGGVG7TGVgND5Yk57" },
    "A401": { building: "Engineering Building A", floor: "4th Floor", room: "A401", mapUrl: "https://maps.app.goo.gl/yGGVG7TGVgND5Yk57" },
    "A402": { building: "Engineering Building A", floor: "4th Floor", room: "A402", mapUrl: "https://maps.app.goo.gl/yGGVG7TGVgND5Yk57" },

    // --- Engineering Building B ---
    "B01": { building: "Engineering Building B", floor: "Basement", room: "B01", mapUrl: "https://maps.app.goo.gl/yGGVG7TGVgND5Yk57" },
    "B02": { building: "Engineering Building B", floor: "Basement", room: "B02", mapUrl: "https://maps.app.goo.gl/yGGVG7TGVgND5Yk57" },
    "B108": { building: "Engineering Building B", floor: "1st Floor", room: "B108", mapUrl: "https://maps.app.goo.gl/yGGVG7TGVgND5Yk57" },

    // --- Administrative Building ---
    "401": { building: "Administrative Building", floor: "4th Floor", room: "401", mapUrl: "https://maps.app.goo.gl/Y3WVbMRgtETKe9i58" },
    "402": { building: "Administrative Building", floor: "4th Floor", room: "402", mapUrl: "https://maps.app.goo.gl/Y3WVbMRgtETKe9i58" },
    "403": { building: "Administrative Building", floor: "4th Floor", room: "403", mapUrl: "https://maps.app.goo.gl/Y3WVbMRgtETKe9i58" },

    // --- Admission Building (GS) ---
    "B01A": { building: "Admission Building (GS)", floor: "Basement", room: "B01A", mapUrl: "https://maps.app.goo.gl/nLdMkNxHz9Gadb8RA" },
    "B01B": { building: "Admission Building (GS)", floor: "Basement", room: "B01B", mapUrl: "https://maps.app.goo.gl/nLdMkNxHz9Gadb8RA" },
    "B03": { building: "Admission Building (GS)", floor: "Basement", room: "B03", mapUrl: "https://maps.app.goo.gl/nLdMkNxHz9Gadb8RA" },
    "001": { building: "Admission Building (GS)", floor: "Ground Floor", room: "001", mapUrl: "https://maps.app.goo.gl/nLdMkNxHz9Gadb8RA" },
    "409": { building: "Admission Building (GS)", floor: "4th Floor", room: "409", mapUrl: "https://maps.app.goo.gl/nLdMkNxHz9Gadb8RA" },
    "415": { building: "Admission Building (GS)", floor: "4th Floor", room: "415", mapUrl: "https://maps.app.goo.gl/nLdMkNxHz9Gadb8RA" },

    // --- Logistics Building ---
    "A403": { building: "Logistics Building", floor: "4th Floor", room: "A403", mapUrl: "https://maps.app.goo.gl/qMZ3spFZqmxt19u4A" },
    "A404": { building: "Logistics Building", floor: "4th Floor", room: "A404", mapUrl: "https://maps.app.goo.gl/qMZ3spFZqmxt19u4A" },
    "A501": { building: "Logistics Building", floor: "5th Floor", room: "A501", mapUrl: "https://maps.app.goo.gl/qMZ3spFZqmxt19u4A" },
    "A503": { building: "Logistics Building", floor: "5th Floor", room: "A503", mapUrl: "https://maps.app.goo.gl/qMZ3spFZqmxt19u4A" }
  };

  // Normalize input: uppercase, strip all whitespace.
  function normalizeCode(code) {
    return code.toUpperCase().replace(/\s+/g, "");
  }

  const input = document.getElementById("roomCodeInput");
  const findButton = document.getElementById("findButton");
  const resultCard = document.getElementById("resultCard");
  const errorBox = document.getElementById("errorBox");
  const resultBuilding = document.getElementById("resultBuilding");
  const resultFloor = document.getElementById("resultFloor");
  const resultRoom = document.getElementById("resultRoom");
  const mapButton = document.getElementById("mapButton");

  let currentMapUrl = null;

  function findRoom() {
    const rawCode = input.value;
    const code = normalizeCode(rawCode);

    resultCard.classList.remove("visible");
    errorBox.classList.remove("visible");

    if (!code) {
      errorBox.classList.add("visible");
      return;
    }

    const match = ROOM_DATABASE[code];

    if (match) {
      resultBuilding.textContent = match.building;
      resultFloor.textContent = match.floor;
      resultRoom.textContent = match.room;
      currentMapUrl = match.mapUrl;
      resultCard.classList.add("visible");
    } else {
      currentMapUrl = null;
      errorBox.classList.add("visible");
    }
  }

  findButton.addEventListener("click", findRoom);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      findRoom();
    }
  });

  mapButton.addEventListener("click", function () {
    if (currentMapUrl) {
      window.open(currentMapUrl, "_blank");
    }
  });
</script>

</body>
</html>
